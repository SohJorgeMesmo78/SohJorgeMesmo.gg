<section class="hero-banner" aria-labelledby="hero-title">
  <div class="hero-banner__visual" aria-hidden="true">
    <div class="hero-banner__glow"></div>
    <img src="/foto.png" alt="SohJorgeMesmo em pose de criador de conteúdo" width="860" height="980" />
  </div>

  <div class="hero-banner__content">
    <button class="hero-banner__eyebrow hero-banner__rotator" (click)="onClick()" aria-label="Ver todas as redes em A Guilda" title="Ir para A Guilda">
      <span class="hero-banner__rotator-item" [class.is-changing]="isChanging">
      <app-icon [name]="items[currentIndex].name" [size]="18"></app-icon>
      <span class="hero-banner__rotator-label">{{ items[currentIndex].label }}</span>
      </span>
    </button>
    <h1 id="hero-title">Taverna do Jooj</h1>
    <p class="hero-banner__tagline">Jogos, caos e decisões questionáveis.</p>

    <div class="hero-banner__meta" aria-label="Resumo da guilda">
      <span>Guilda</span>
      <span>Lives às 19h</span>
      <span>Canal em alta</span>
    </div>
  </div>
</section>
