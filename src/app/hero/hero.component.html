<section class="hero-banner" aria-labelledby="hero-title">
  <div class="hero-banner__stars" aria-hidden="true"></div>
  <div class="hero-banner__village" aria-hidden="true"></div>
  <div class="hero-banner__standards" aria-hidden="true"><span></span><span></span></div>

  <div class="hero-banner__content">
    <h1 id="hero-title" class="hero-banner__sr-only">SohJorgeMesmo — Entra pra Guilda</h1>
    <button class="hero-banner__identity" (click)="onClick()" aria-label="Entrar na Guilda e ver todas as redes" title="Ir para A Guilda">
      <img src="/assets/brand/png/SohJorgeMesmo.png" alt="" width="1672" height="941" />
    </button>
  </div>

  <div class="hero-banner__cats" aria-hidden="true">
    <img class="hero-banner__cat hero-banner__cat--tabby" src="/assets/brand/png/cat-tabby.png" alt="" width="650" height="810" />
    <img class="hero-banner__cat hero-banner__cat--siamese" src="/assets/brand/png/cat-siamese.png" alt="" width="604" height="850" />
    <img class="hero-banner__cat hero-banner__cat--black" src="/assets/brand/png/cat-black.png" alt="" width="1184" height="494" />
  </div>

  <div class="hero-banner__jorge">
    <div class="hero-banner__glow" aria-hidden="true"></div>
    <img class="hero-banner__jorge-image" src="/assets/brand/png/jorge-hero.png" alt="SohJorgeMesmo sorrindo e apresentando a Guilda" width="1448" height="1086" />
    <img class="hero-banner__mascot" src="/assets/brand/png/jorginho-happy.png" alt="" width="512" height="512" aria-hidden="true" />
  </div>
</section>
