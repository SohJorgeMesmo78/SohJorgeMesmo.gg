<article class="live-strip" aria-label="Twitch" *ngIf="twitch$ | async as twitch">
  <p class="live-strip__label">Twitch</p>
  <p class="live-strip__value">{{ twitch.schedule }}</p>
  <a
    [href]="twitch.externalUrl"
    target="_blank"
    rel="noopener noreferrer"
    class="live-strip__button"
  >
    Assistir na Twitch
  </a>
</article>
