<section class="links-card" aria-labelledby="links-title">
  <header class="links-card__header">
    <p class="links-card__label">A Guilda</p>
    <h2 id="links-title">Siga a jornada</h2>
  </header>

  <div class="links-card__primary">
    <ng-container *ngFor="let link of primaryLinks; trackBy: trackById">
      <a
        [href]="link.url"
        target="_blank"
        rel="noopener noreferrer"
        class="link-button"
        [attr.aria-label]="'Ir para ' + link.name"
      >
        <span class="link-button__label">{{ link.label }}</span>
      </a>
    </ng-container>
  </div>

  <div class="links-card__secondary" aria-label="Outras redes sociais">
    <ng-container *ngFor="let link of secondaryLinks; trackBy: trackById">
      <a
        [href]="link.url"
        target="_blank"
        rel="noopener noreferrer"
        class="link-pill"
        [attr.aria-label]="'Ir para ' + link.name"
      >
        <span>{{ link.label }}</span>
      </a>
    </ng-container>
  </div>
</section>
