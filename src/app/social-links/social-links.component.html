<section class="links-card" aria-labelledby="links-title" id="guild">
  <app-cat-easter-egg class="links-card__cat" cat="liz" label="Liz"></app-cat-easter-egg>
  <header class="links-card__header">
    <p class="links-card__label">A Guilda</p>
    <h2 id="links-title">Siga a jornada</h2>
  </header>
  <div class="links-grid">
    <ng-container *ngFor="let link of socialLinks; trackBy: trackById">
      <a
        [href]="link.url"
        target="_blank"
        rel="noopener noreferrer"
        class="link-card"
        [attr.aria-label]="'Ir para ' + link.name"
      >
        <div class="link-card__icon">
          <app-icon [name]="link.icon" [size]="22"></app-icon>
        </div>
        <div class="link-card__body">
          <div class="link-card__title">{{ link.name }}</div>
          <div class="link-card__handle">{{ link.handle }}</div>
        </div>
      </a>
    </ng-container>
  </div>
</section>
