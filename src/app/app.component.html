<div class="scroll-progress" aria-hidden="true"></div>
<main class="page-shell" role="main">
  <div class="page-shell__content">
    <app-hero appReveal></app-hero>

    <div class="page-shell__feature-row" appReveal aria-label="Informações rápidas">
      <app-twitch-section></app-twitch-section>
      <app-youtube-section></app-youtube-section>
    </div>

    <div class="page-shell__nico" aria-hidden="true">
      <app-cat-easter-egg class="page-shell__nico-cat" cat="nico" label="Nico"></app-cat-easter-egg>
    </div>

    <app-social-links appReveal></app-social-links>
    <app-latest-video appReveal></app-latest-video>
    <app-arsenal appReveal></app-arsenal>
  </div>
</main>

<app-footer></app-footer>
@defer (when devControlsEnabled) {
  <app-dev-controls></app-dev-controls>
}
