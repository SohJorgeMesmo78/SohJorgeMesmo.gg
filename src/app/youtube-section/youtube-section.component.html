<article class="channel-strip" aria-label="Canal do YouTube" *ngIf="channel$ | async as channel">
  <p class="channel-strip__label">YouTube</p>
  <p class="channel-strip__value">{{ channel.name }} • {{ channel.subscriberCount }} inscritos</p>
  <a
    [href]="channel.externalUrl"
    target="_blank"
    rel="noopener noreferrer"
    class="channel-strip__link"
  >
    Acessar canal
  </a>
</article>
