<article class="youtube-card" aria-labelledby="youtube-title">
  <div class="youtube-card__body" *ngIf="channel$ | async as channel">
    <div class="youtube-card__identity">
      <span class="youtube-card__icon" aria-hidden="true">▶</span>
      <div>
        <p class="youtube-card__eyebrow">YouTube</p>
        <h2 id="youtube-title">{{ channel.name }}</h2>
      </div>
    </div>

    <p class="youtube-card__stats">{{ channel.subscriberCount }} inscritos</p>

    <a
      [href]="channel.externalUrl"
      target="_blank"
      rel="noopener noreferrer"
      class="button button--solid"
    >
      ▶ Ver vídeos
    </a>
  </div>
</article>
