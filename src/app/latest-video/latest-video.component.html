<article class="video-feature" aria-labelledby="latest-video-title">
  <header class="video-feature__header">
    <p class="video-feature__eyebrow">O que tá rolando</p>
  </header>

  <div class="video-feature__content" *ngIf="video$ | async as video">
    <a
      [href]="video.externalUrl"
      target="_blank"
      rel="noopener noreferrer"
      class="video-feature__thumbnail"
      [class.video-feature__thumbnail--new]="isNewVideo(video.date)"
      [attr.aria-label]="'Assistir no YouTube: ' + video.title"
    >
      <img [src]="video.thumbnailUrl" [alt]="video.title" />
      <span class="video-feature__play">▶ Assistir</span>
      <span class="video-feature__quest" *ngIf="isNewVideo(video.date)" title="Nova missão disponível" aria-label="Nova missão disponível">!</span>
    </a>

    <div class="video-feature__info">
      <div class="video-feature__meta-row" *ngIf="channel$ | async as channel">
        <span>{{ channel.name }}</span>
        <span>•</span>
        <span>{{ channel.subscriberCount }} inscritos</span>
      </div>

      <div class="video-feature__title-row">
        <h2 id="latest-video-title">{{ video.title }}</h2>
        <span class="video-feature__new-badge" *ngIf="isNewVideo(video.date)">NOVA MISSÃO</span>
      </div>

      <p class="video-feature__meta">{{ formatPublishedAt(video.date) }}</p>

      <a
        [href]="video.externalUrl"
        target="_blank"
        rel="noopener noreferrer"
        class="button button--outline"
      >
        Assistir →
      </a>
    </div>
  </div>
</article>
