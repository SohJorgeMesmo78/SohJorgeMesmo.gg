<article class="video-feature" aria-labelledby="latest-video-title">
  <header class="video-feature__header">
    <p class="video-feature__eyebrow">O que tá rolando</p>
  </header>

  <div class="video-feature__content" *ngIf="video$ | async as video">
    <a
      [href]="video.externalUrl"
      target="_blank"
      rel="noopener noreferrer"
      class="video-feature__thumbnail"
      [attr.aria-label]="'Assistir no YouTube: ' + video.title"
    >
      <img [src]="video.thumbnailUrl" [alt]="video.title" />
      <span class="video-feature__play">▶ Assistir</span>
    </a>

    <div class="video-feature__info">
      <p class="video-feature__meta">{{ video.date }}</p>
      <h2 id="latest-video-title">{{ video.title }}</h2>
      <a
        [href]="video.externalUrl"
        target="_blank"
        rel="noopener noreferrer"
        class="button button--outline"
      >
        Assistir →
      </a>
    </div>
  </div>
</article>
