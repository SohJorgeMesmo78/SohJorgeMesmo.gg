<section class="events" aria-labelledby="events-title">
  <header class="events__header">
    <div>
      <p class="events__eyebrow">Agenda semanal</p>
      <h2 id="events-title">Eventos</h2>
    </div>
    <p class="events__intro">Marca na agenda e chega junto.</p>
  </header>

  <ul class="events__calendar" aria-label="Calendário semanal de eventos">
    @for (event of events; track event.weekday) {
      <li>
        <a
          class="event-card"
          [class.event-card--video]="event.type === 'video'"
          [href]="event.url"
          target="_blank"
          rel="noopener noreferrer"
          [attr.aria-label]="event.recurrence + ': ' + event.title + ' às ' + event.time + ' (abre em nova aba)'"
        >
          <div class="event-card__date" aria-hidden="true">
            <span>{{ event.weekday.slice(0, 3) }}</span>
            <strong>{{ event.time }}</strong>
          </div>
          <div class="event-card__info">
            <p class="event-card__recurrence">{{ event.recurrence }}</p>
            <h3><span class="event-card__dot" aria-hidden="true"></span>{{ event.title }}</h3>
            <p>{{ event.description }}</p>
          </div>
        </a>
      </li>
    }
  </ul>
</section>
